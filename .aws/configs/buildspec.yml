# CodeBuild (pipeline.yml): construye la imagen, la sube a ECR y genera imagedefinitions.json para el Deploy de ECS.
# Variables del proyecto CodeBuild: AWS_ACCOUNT_ID, ECR_REPOSITORY_NAME, CONTAINER_NAME (AWS_REGION la pone CodeBuild).
version: 0.2
phases:
  pre_build:
    commands:
      - REPO_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY_NAME
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com
  build:
    commands:
      - docker build -t $REPO_URI:latest .
      - docker push $REPO_URI:latest
      - printf '[{"name":"%s","imageUri":"%s"}]' "$CONTAINER_NAME" "$REPO_URI:latest" > imagedefinitions.json
artifacts:
  files:
    - imagedefinitions.json
