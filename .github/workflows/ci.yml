name: CI — Timia Hub API
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

# La imagen NO se construye aquí: la construye CodeBuild, dentro de AWS, donde
# public.ecr.aws no tiene límite de descargas. Este workflow la construía también
# y empezó a fallar con 429 "Data limit exceeded": los runners de GitHub comparten
# IP y public.ecr.aws corta por volumen para descargas anónimas.
# Si alguna vez hace falta validar el Dockerfile en el PR, la vía es hadolint
# (analiza el archivo sin descargar la imagen base), no un docker build.
